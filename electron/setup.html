<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TesT · 选择数据目录</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
        --bg: #f1f3f1;
        --card: rgba(255, 255, 255, 0.84);
        --text: #111513;
        --muted: #68706c;
        --border: #d8ddd9;
        --accent: #1f9d74;
        --accent-soft: #e8f6ef;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f0d;
          --card: rgba(24, 31, 27, 0.88);
          --text: #ecf1ed;
          --muted: #929d96;
          --border: #2b352f;
          --accent: #3ddc97;
          --accent-soft: #14261d;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 12%, rgba(61, 220, 151, 0.18), transparent 34%),
          radial-gradient(circle at 88% 86%, rgba(88, 142, 255, 0.12), transparent 38%),
          var(--bg);
      }
      .card {
        width: min(600px, calc(100vw - 40px));
        padding: 30px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.16);
        backdrop-filter: blur(20px);
      }
      .logo {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 15px;
        background: #111;
        color: #fff;
        font-size: 22px;
        font-weight: 750;
      }
      h1 { margin: 20px 0 6px; font-size: 24px; letter-spacing: -0.03em; }
      p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
      .path {
        margin: 22px 0 12px;
        padding: 13px 14px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(128, 128, 128, 0.06);
        font: 12px/1.5 "Cascadia Code", Consolas, monospace;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 24px; }
      button {
        height: 38px;
        padding: 0 16px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.primary { border-color: #111; background: #111; color: #fff; }
      button:hover { transform: translateY(-1px); }
      .tip { margin-top: 15px; font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">T</div>
      <h1>选择 TesT 数据目录</h1>
      <p>会话、登录凭证、模型配置和扩展会保存在这里。建议选择非系统盘目录。</p>
      <div class="path" id="path">正在读取…</div>
      <p class="tip">程序安装位置与此目录相互独立。以后可在设置中迁移。</p>
      <div class="actions">
        <button id="choose" type="button">选择目录</button>
        <button id="confirm" class="primary" type="button">使用此目录</button>
      </div>
    </main>
    <script>
      let dataDir = "";
      const pathEl = document.getElementById("path");
      window.setupAPI.getInfo().then((info) => {
        dataDir = info.dataDir;
        pathEl.textContent = dataDir;
      });
      document.getElementById("choose").addEventListener("click", async () => {
        const result = await window.setupAPI.chooseFolder();
        if (result?.dataDir) {
          dataDir = result.dataDir;
          pathEl.textContent = dataDir;
        }
      });
      document.getElementById("confirm").addEventListener("click", () => {
        if (dataDir) void window.setupAPI.confirm(dataDir);
      });
    </script>
  </body>
</html>

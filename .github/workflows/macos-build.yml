name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to receive the DMGs"
        required: false
        type: string
  push:
    tags:
      - "v*-macos*"

permissions:
  contents: write

jobs:
  build:
    name: macOS arm64 + x64
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_VERSION: "24.20.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build renderer
        run: npm run build

      - name: Build arm64 DMG
        run: |
          npm run prepare:electron
          npx electron-builder --mac dmg --arm64 --publish never

      - name: Download x64 Node runtime
        run: |
          mkdir -p tools/node-x64
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-x64.tar.gz" \
            | tar -xz -C tools/node-x64 --strip-components=1
          tools/node-x64/bin/node --version

      - name: Build x64 DMG
        run: |
          TEST_NODE="$PWD/tools/node-x64/bin/node" npm run prepare:electron
          npx electron-builder --mac dmg --x64 --publish never

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TesT-macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Attach DMGs to release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" release/*.dmg --clobber
